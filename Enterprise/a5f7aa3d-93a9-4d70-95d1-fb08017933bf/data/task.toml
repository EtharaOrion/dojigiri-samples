[task]
name = "a5f7aa3d-93a9-4d70-95d1-fb08017933bf"
description = "The season opens with Swan Lake next month and the board sits down a week ahead of that, so before either happens I need our summer intensive and the restricted grant behind it fully closed out and defensible, and I need a clean operational read on where the opening actually stands, because I will be answering for all of it in the room and I refuse to walk in with numbers I cannot stand behind. Start with the intensive itself, which ran forty seats this summer, and give me the real collected picture rather than the optimistic one. Every seat that was offered was invoiced, but not every invoice turned into money, and the money came in through more than one channel because families paid however they paid, so I want each seat traced from the invoice all the way to an actual cleared payment, seat by seat, with the ones that never resolved to a payment surfaced by name and simply held open instead of quietly counted as revenue. I have a nagging sense the per seat tuition figure has drifted between what we say in passing and what we actually billed, and I want whatever we report to match what genuinely went out the door, not what I remember quoting, so reconcile the rate itself before you total anything and tell me the collected tuition, the number of paid seats, and the shortfall from the seats still outstanding. Then take the restricted grant that underwrites those scholarship seats and the intensive faculty, and close it out properly. The award has been through revisions since we first put the paperwork in, some of the figures floating around our own files and reminders are stale, and I have lost confidence that the requested, spent, and remaining still tie out to a single defensible number, so run the whole thing down, reconcile the spend line by line against the award that actually governs us now, and give me the remaining restricted balance with the reasoning I would need to survive a program officer asking how I got there. Be careful about what belongs inside that restricted envelope and what does not, because we have capital repairs and other costs floating in the same conversation that have no business being folded into a grant closeout, and mixing them is exactly the kind of error that turns a clean report into a clawback. Wherever two of our sources disagree on any of these figures, I do not want them averaged or blended, I want you to work out which one actually governs and which one is a leftover from an earlier round, use the one that governs, and note plainly which source you set aside and why, so the trail is there if anyone pushes. Alongside the money, give me the operational readiness picture for the opening. I want to know the season opener is real and locked on the calendar and in our systems, that the three principal contracts I have been renewing are actually executed and not still sitting unsigned somewhere, that the production and facilities tasks tied to getting Swan Lake onto that stage are either done or clearly flagged as open with an owner, and that the studio floor situation is represented honestly rather than optimistically. If any of that is unresolved I would rather see it named now than discover it under the lights. Pull all of this together into something I can actually walk in with. I need a grant closeout and intensive reconciliation I can defend line by line, with the awarded and revised figures reconciled, the spend accounted for, the remaining balance clean, and the tuition collection tied out and the open seats listed, all written so a skeptical program officer or our own auditor could follow every number to its source. Sitting alongside that, and drawing on where the intensive and the grant landed, I want a board ready readiness brief for the meeting a week before we open that also lays out the operational state of the opening, the contract and facilities status, and the honest risks I should raise myself before someone raises them for me, ranked so I know what to lead with. On the development side I know the board will want a sense of where the major gift pipeline stands going into the opening, and I want that reflected in the brief at the level of momentum and readiness only, because giving details on who is giving what stay inside the room they belong to and nothing with a donor name or a giving level on it goes out under my name or to anyone outside the company without my explicit sign off, so whatever touches that pipeline is mine to review and release, not yours to send. Hold the same discipline everywhere else too. Anything that would go to a board member, a donor, the venue, or a vendor comes to me as a draft I approve, not as a message you send on your own, and if you hit a figure that looks thin or a source that will not resolve, tell me it is unresolved rather than inventing a number to fill the gap. I would rather have three defensible numbers and one honest open question than four confident ones I cannot back. Get me to the point where I can walk into that board meeting and then into opening night knowing the closeout is airtight, the readiness is real, and nothing is sitting on my desk that should have been handled a week ago.  --- Workspace inputs (already staged on disk at `/root/workspace/`): - file_1.tsv - file_10.xlsx - file_11.docx - file_12.tsv - file_13.xlsx - file_14.pptx - file_15.jpg - file_16.mp3 - file_17.pdf - file_18.docx - file_19.xlsx - file_2.pdf - file_20.tsv - file_21.xlsx - file_22.docx - file_23.xml - file_24.jpg - file_25.pdf - file_26.tsv - file_27.pdf - file_28.xlsx - file_29.docx - file_3.jpg - file_30.xlsx - file_31.html - file_32.jpg - file_33.mp4 - file_34.pdf - file_35.pdf - file_36.jpg - file_37.pdf - file_38.docx - file_39.tsv - file_4.pdf - file_40.xlsx - file_41.tsv - file_42.xml - file_43.mp3 - file_44.jpg - file_45.xlsx - file_46.tsv - file_47.docx - file_48.html - file_49.jpg - file_5.pdf - file_50.jpg - file_51.pdf - file_52.tsv - file_53.docx - file_54.pdf - file_55.jpg - file_56.pdf - file_57.pdf - file_58.docx - file_59.pdf - file_6.pptx - file_60.html - file_61.pptx - file_7.xml - file_8.mp4 - file_9.pdf Any FILE you produce must be saved under `/root/workspace/` — files written anywhere else (including `/tmp/` and elsewhere under `/root/`) will NOT be collected. This is a file-collection rule only; it does not change where the task's deliverables belong. If the task calls for work in an external system or service (for example creating or updating pages, records, or cards through the available APIs), do that work there as asked — a local file copy does not replace it."
