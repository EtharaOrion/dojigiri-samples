[task]
name = "fca28cac-99fc-4548-9367-9c4816aa3c0b"
description = "The water quality section I owe Cortez for the annual report is due at the top of next month, and I do not trust the numbers sitting in the working draft in Notion anymore, so before it goes anywhere near a board packet I need the whole fourteen site picture trued up and defensible. That draft was built off an old sampling round and a fair number of those phosphorus and PFAS figures are stale from earlier in the year, and I have lost confidence they still line up with the freshest pull we did across the watershed, the current lab results sitting in my Gmail inbox, so I want every site reconciled against the most current results we actually have on hand and every final number I quote to be one I can stand behind in front of the board. Walk the whole set, not a sample, because the headline of the section is how many of the fourteen sites sit under the phosphorus limit and how many have crossed it, and if that count is wrong the section is wrong and so is anything Cortez says on the strength of it. Where a site's current reading disagrees with what the draft claims, I need you to run it down, figure out which reading is the one we should actually be reporting, and tell me plainly what changed and why the number you kept is the one that governs, because at least a couple of these look like they moved and one of them may push a site over a line the draft still says nobody has crossed. Hold the phosphorus results and the PFAS results as two separate stories and keep each one in the units the program actually reports them in, and if the evidence for any single site is thin or the sources genuinely disagree in a way you cannot resolve cleanly, flag it as unresolved and tell me what a second confirmation would take rather than forcing a verdict I would have to walk back later. Out of that reconciled set I want the finished water quality findings written up the way it will read in the report, the count of sites under and over the limit stated up front, the PFAS picture classified against the action level documented on the coalition's Confluence wiki, and the sites of real concern named, and I want it structured so Cortez can drop it straight into the report with a director's letter in front of it and the advocacy section behind it. On top of that, and separately, I need a tighter board only brief pulled from the same reconciled findings, cross-checked against what the board has been flagging in the coalition Slack channel, that speaks to the county hearing on the CAFO permit expansion, focused on the creek below that parcel and what our sampling there shows, framed for the board and the board alone, because this is campaign material and none of the raw data or the framing goes outside the coalition board or anywhere near the county or a reporter until the board has actually approved it, and the report itself stays a working draft in my hands until that approval lands. Nobody has signed off yet, so treat everything you produce as mine to review and not as anything that ships. While that is running I also owe the report a finance summary for the brewery side, and I have been sloppy about the Q4 cost picture, so I need the recent batches checked for whether the alcohol figures were computed correctly off the gravities we logged, and I need the ingredient cost per batch recomputed against the current malt pricing, because the malt went up across several base grains and if I am quoting margins off an old cost basis the finance summary is fiction. Give me the per batch cost after the current pricing, the batch margins that fall out of it at the prices we actually sell those beers for, and a clean read on where the wholesale side stands, meaning what our self distribution accounts owe us right now in QuickBooks, which of them are carrying a balance worth chasing before the quarter closes, and what the total outstanding across the book actually comes to, so the finance summary in the report reflects money we can count on rather than money we hoped for. Keep every dollar of this on the brewery's side of the wall and out of the coalition material, they are two different organizations and the report just happens to carry a page from each. Sequence it so the reconciled water findings exist before you try to write either the section or the board brief off them, since both depend on the same trued up numbers, and get the section far enough along that Cortez has something real to review well ahead of the assembly date and not the night before. Anything I have not explicitly cleared, from touching the accounts to sending a line to anyone outside my own review, you hold and ask me first, and if a supplier price or a lab result is missing outright, say so and tell me what you would need rather than guessing a number into the report.  --- Workspace inputs (already staged on disk at `/root/workspace/`): - 01.xlsx - 02.mp3 - 03.tsv - 04.xlsx - 05.mp3 - 06.xlsx - 07.html - 08.tsv - 09.tsv - 10.mp4 - 11.html - 12.png - 13.jpg - 14.html - 15.xlsx - 16.xlsx - 17.docx - 18.docx - 19.pptx - 20.png - 21.pdf - 22.pptx - 23.png - 24.png - 25.png - 26.mp4 - 27.pdf - 28.xlsx - 29.pdf - 30.pdf - 31.pdf - 32.pdf - 33.pdf - 34.pdf - 35.tsv - 36.tsv - 37.jpg - 38.pptx - 39.jpeg - 40.xml - 41.pdf - 42.pdf - 43.pdf - 44.pdf - 45.pdf - 46.xlsx - 47.tsv - 48.xlsx - 49.xlsx - 50.pdf - 51.xml - 52.xml Any FILE you produce must be saved under `/root/workspace/` — files written anywhere else (including `/tmp/` and elsewhere under `/root/`) will NOT be collected. This is a file-collection rule only; it does not change where the task's deliverables belong. If the task calls for work in an external system or service (for example creating or updating pages, records, or cards through the available APIs), do that work there as asked — a local file copy does not replace it."
