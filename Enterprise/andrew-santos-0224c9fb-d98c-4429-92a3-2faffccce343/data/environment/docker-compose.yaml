services:
  main:
    build:
      context: .
    image: harbor-main:local
    command: ["sleep", "infinity"]
    depends_on:
      activecampaign-api:
        condition: service_healthy
      asana-api:
        condition: service_healthy
      confluence-api:
        condition: service_healthy
      docusign-api:
        condition: service_healthy
      eventbrite-api:
        condition: service_healthy
      figma-api:
        condition: service_healthy
      freshdesk-api:
        condition: service_healthy
      gmail-api:
        condition: service_healthy
      google-calendar-api:
        condition: service_healthy
      hubspot-api:
        condition: service_healthy
      mailchimp-api:
        condition: service_healthy
      microsoft-teams-api:
        condition: service_healthy
      notion-api:
        condition: service_healthy
      paypal-api:
        condition: service_healthy
      quickbooks-api:
        condition: service_healthy
      salesforce-api:
        condition: service_healthy
      sendgrid-api:
        condition: service_healthy
      slack-api:
        condition: service_healthy
      square-api:
        condition: service_healthy
      stripe-api:
        condition: service_healthy
      typeform-api:
        condition: service_healthy
      webflow-api:
        condition: service_healthy
      xero-api:
        condition: service_healthy
    environment:
      - ACTIVECAMPAIGN_API_URL=http://activecampaign-api:8101
      - ASANA_API_URL=http://asana-api:8031
      - CONFLUENCE_API_URL=http://confluence-api:8045
      - DOCUSIGN_API_URL=http://docusign-api:8053
      - EVENTBRITE_API_URL=http://eventbrite-api:8020
      - FIGMA_API_URL=http://figma-api:8079
      - FRESHDESK_API_URL=http://freshdesk-api:8093
      - GMAIL_API_URL=http://gmail-api:8017
      - GOOGLE_CALENDAR_API_URL=http://google-calendar-api:8016
      - HUBSPOT_API_URL=http://hubspot-api:8024
      - MAILCHIMP_API_URL=http://mailchimp-api:8081
      - MICROSOFT_TEAMS_API_URL=http://microsoft-teams-api:8086
      - NOTION_API_URL=http://notion-api:8010
      - PAYPAL_API_URL=http://paypal-api:8042
      - QUICKBOOKS_API_URL=http://quickbooks-api:8007
      - SALESFORCE_API_URL=http://salesforce-api:8044
      - SENDGRID_API_URL=http://sendgrid-api:8027
      - SLACK_API_URL=http://slack-api:8013
      - SQUARE_API_URL=http://square-api:8041
      - STRIPE_API_URL=http://stripe-api:8021
      - TYPEFORM_API_URL=http://typeform-api:8055
      - WEBFLOW_API_URL=http://webflow-api:8100
      - XERO_API_URL=http://xero-api:8088
      - LITELLM_BASE_URL=http://litellm-proxy:4000
      - OPENAI_API_BASE=http://litellm-proxy:4000/v1
      - OPENAI_API_KEY=placeholder
      - TEST_DIR=${TEST_DIR:-/tests}
    volumes:
      - ${HOST_VERIFIER_LOGS_PATH:-./logs/verifier}:${ENV_VERIFIER_LOGS_PATH:-/logs/verifier}
  activecampaign-api:
    build:
      context: ./activecampaign-api
    image: harbor-activecampaign-api:local
    expose:
      - "8101"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8101/health',timeout=3).status<400 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256Mi
  asana-api:
    build:
      context: ./asana-api
    image: harbor-asana-api:local
    expose:
      - "8031"
    healthcheck:
