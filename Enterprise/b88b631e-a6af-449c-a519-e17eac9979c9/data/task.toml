[task]
name = "b88b631e-a6af-449c-a519-e17eac9979c9"
description = "I need everything trued up and defensible before I stand up in front of the county board at the hearing later this month, because once I am on the record opposing that permit expansion I cannot walk a number back, and right now I do not trust that the figures scattered across my drafts, my inbox, and the ledger still agree with each other. Start with the water quality story, because that is the spine of the whole thing. There is a public comment draft floating around that leans on a headline count of how many of the fourteen river sites are running over the phosphorus target, and I have lost confidence that the count in that draft still matches what the field crews actually logged after the later sampling rounds, so I need the current standing of all fourteen sites walked site by site, each reading checked against the freshest entry we have rather than whatever number happened to land in an early draft, the exceedances and the near misses called out honestly, and anything where the evidence is thin or the readings disagree flagged as unsettled instead of rounded into a clean claim I would have to defend under questioning. I want that reconciled into an evidence brief I can actually testify from, ordered by which sites carry the argument, with the reasoning and the provenance behind every figure so that if a supervisor pushes on any single number I can say exactly where it came from and why I trust it. While that is running I need the coalition annual report water section brought in line with the same verified numbers, because it cannot say one thing while my testimony says another, and David and the board are working off whatever the shared record currently shows. Second, the money has to be honest, because I am also feeding a cash position into the coalition finance committee work and I am carrying this whole campaign on a year three brewery that cannot afford a surprise. Go through the distribution invoices and the supplier bills and the payments one account at a time and give me a reconciled read on what we are actually owed, what we actually owe, and where the operating cash truly sits, not the round revenue and expense figures I have been quoting from memory for months, because those were a projection and I want to know whether reality still lines up with them or has drifted, and if it has drifted I want the real net and the gap explained rather than smoothed over. Watch the malt order in particular, because there are a few confirmations sitting in my inbox with different quantities on the same Oktoberfest run and I genuinely do not remember which one is the version we settled on, so pin down the amount that actually stands and tell me which one you set aside and why before anything gets treated as ordered. Any figure that goes into either the finance picture or the testimony has to be traceable back to its source and recomputed, not lifted from an old note, because a wrong decimal in front of the board or in front of the committee is the kind of mistake that follows you. Third, I need to know exactly where the campaign itself stands going into the hearing, the milestone state pulled from the actual working record rather than my sense of it, what is genuinely finished versus what is only mostly there, and a short readiness read that tells me what still has to close before I walk in, because I have watched status get marked done in one place while the underlying work sat half open somewhere else and I will not get blindsided on the twenty second. Fourth, get the whole thing into a state where it is ready to move the moment I say go, meaning the testimony package and the underlying evidence organized and staged and internally consistent, but nothing actually sent to the county and nothing handed to a reporter or a supervisor on its own steam, because I decide when regulatory material leaves my hands and I decide what a board member or the press ever sees, and the raw site data and the internal campaign strategy stay inside the circle that is already read in until I explicitly clear otherwise. Keep the brewery financial detail just as tight, that is between me and Jake and the accountant and nobody else. Sequence this the way it actually depends, the numbers get reconciled and verified before anything gets drafted from them, the drafts get squared against each other before anything gets called ready, and the readiness read comes last once you actually know what is closed. I would rather you come back and tell me two sites are genuinely unsettled and one financial line does not tie out than hand me a tidy package that papers over a disagreement I am going to trip on in front of a room full of people who want the permit to pass. Lead with what changed against what I thought was true, tell me every place the story changed from what I had and which version you stood behind and why, and give me the whole thing in a shape I can act on rather than a pile I have to re sort myself.  --- Workspace inputs (already staged on disk at `/root/workspace/`): - 01.xlsx - 02.mp3 - 03.tsv - 04.xlsx - 05.mp3 - 06.xlsx - 07.html - 08.tsv - 09.tsv - 10.mp4 - 11.html - 12.png - 13.jpg - 14.html - 15.xlsx - 16.xlsx - 17.docx - 18.docx - 19.pptx - 20.png - 21.pdf - 22.pptx - 23.png - 24.png - 25.png - 26.mp4 - 27.pdf - 28.xlsx - 29.pdf - 30.pdf - 31.pdf - 32.pdf - 33.pdf - 34.pdf - 35.tsv - 36.tsv - 37.jpg - 38.pptx - 39.jpeg - 40.xml - 41.pdf - 42.pdf - 43.pdf - 44.pdf - 45.pdf - 46.xlsx - 47.tsv - 48.xlsx - 49.xlsx - 50.pdf - 51.xml - 52.xml Any FILE you produce must be saved under `/root/workspace/` — files written anywhere else (including `/tmp/` and elsewhere under `/root/`) will NOT be collected. This is a file-collection rule only; it does not change where the task's deliverables belong. If the task calls for work in an external system or service (for example creating or updating pages, records, or cards through the available APIs), do that work there as asked — a local file copy does not replace it."
