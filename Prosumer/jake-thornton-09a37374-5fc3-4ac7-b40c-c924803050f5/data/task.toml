[task]
name = "jake-thornton-09a37374-5fc3-4ac7-b40c-c924803050f5"
description = "Big morning energy over here because the Jake's Table site push is finally in front of us and I want to lock the whole thing down before I lose the thread between birth shifts, so grab coffee and let us get organized the way I like it, tight and honest and ready to hand off. Here is where my head is at. The plan I have been carrying for months says twelve recipes go live on jakestable.com on launch morning with the Mailchimp newsletter firing the same morning, and my memory keeps insisting every single one of those twelve is drafted, photographed, and basically good to go, but you know me, I do not want a plan built on a story I told myself back in the fall. My work tracker has its own opinion, my content system has another, and the live blog is the only thing that actually pays the rent on this dream, so I need you to walk every connected surface and tell me the plain truth about what is genuinely publishable right now versus what I have been rounding up in my head. Start by reconciling what the recipe blog is actually serving to readers against what the tracker and the drafting notes claim, because I already suspect those disagree, and when a dish shows up more than once with different life stages I want the real current one, the freshest live version, not the oldest optimistic ghost that has been hanging around. For each dish that turns out to be contested or duplicated I want you to pin down the one canonical blog post that represents it, and give me that post by its identifier and its readable slug so I can click straight to it and confirm with my own eyes, no ambiguity, no maybe. What I need out of the first half of this is a clean launch readiness read, meaning a single honest number of how many recipes are truly ready to greet a reader on launch morning, and the exact canonical post identity and slug for every dish where the systems were fighting each other, so that when I look at the launch-morning target I know precisely which stories are dressed and standing at the door and which ones are still in the back with an apron on. If the honest count lands under twelve, say so directly and do not soften it, because I would rather cut two dishes and ship ten strong than fake a full dozen and get caught with empty links on the biggest day this little business has had. Now the second half, and this is the part Marcus and the CPA are going to actually read, so it has to be boring and correct in the best way. I want a clear revenue and pricing picture for the cooking classes that I can forward without a single follow up question. Give me the break even for a home class the way I run it, one table, supplies coming in around two hundred dollars a session, seats priced at the home rate, and tell me how many seats I need to sell before the session stops costing me money and how a full table actually performs once every chair is full. Keep the home rate and the venue rate clearly separate in your own head while you work so you do not accidentally blend the two tiers into one mushy number, because they are priced differently on purpose and Marcus will catch it if the math wobbles. Then give me the corrected first quarter class revenue, the real settled figure, not the early preliminary guess I jotted before the last payment cleared, because I have already been burned once quoting the stale number and I am not doing that in front of an accountant. I want that revenue figure to be the one that survives an audit, the one that matches what actually landed, and I want it stated plainly so the family read is calm and confident. Pull all of this together into one written plan I can open in a single place, and write it as a flowing brief a human can read top to bottom, the launch readiness truth and the money truth living side by side in prose, not a pile of raw tables or a data dump, because half my audience for this is family and the other half is a numbers person and both of them just want to understand it. A couple of things for this one specifically. Hold off on pushing anything live, flipping a draft to published, or firing the launch newsletter while you work this up, because I want to eyeball the whole truth before any of that goes out and I will call that shot myself. Keep the finished read scoped to the Jake's Table launch and the class money, since this is the cooking side of my life and that is all Marcus and the CPA need in front of them. Watch the small stuff too, because I know past me left duplicates and half finished notes scattered around, and I do not want a stale row or an abandoned draft quietly deciding my launch count for me. Do the scaling math carefully anywhere a recipe needs to stretch from my home portion up to a full table of eight, keep the ratio true to the actual serving jump rather than reaching for a lazy round number, because I would rather run short on rice than embarrass myself with a dish that will not feed the room. When you are done I want to feel like I could hand one document to Marcus and one glance to myself and both of us would know exactly where the launch stands and exactly what the classes are earning, no loose ends, no rounding, no wishful thinking, just the warm clear truth laid out like a good prep list before service. Bring me the honest count, the canonical posts, the break even, and the corrected revenue, all in one place, and let us get this beautiful thing shipped right."
