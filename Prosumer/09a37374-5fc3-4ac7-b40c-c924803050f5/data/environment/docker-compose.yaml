services:
  main:
    build:
      context: .
    image: harbor-main:local
    command: ["sleep", "infinity"]
    depends_on:
      airtable-api:
        condition: service_healthy
      asana-api:
        condition: service_healthy
      calendly-api:
        condition: service_healthy
      contentful-api:
        condition: service_healthy
      docusign-api:
        condition: service_healthy
      gmail-api:
        condition: service_healthy
      google-analytics-api:
        condition: service_healthy
      hubspot-api:
        condition: service_healthy
      instagram-api:
        condition: service_healthy
      klaviyo-api:
        condition: service_healthy
      linear-api:
        condition: service_healthy
      mailchimp-api:
        condition: service_healthy
      mixpanel-api:
        condition: service_healthy
      notion-api:
        condition: service_healthy
      plaid-api:
        condition: service_healthy
      quickbooks-api:
        condition: service_healthy
      salesforce-api:
        condition: service_healthy
      slack-api:
        condition: service_healthy
      stripe-api:
        condition: service_healthy
      twilio-api:
        condition: service_healthy
      webflow-api:
        condition: service_healthy
      woocommerce-api:
        condition: service_healthy
      wordpress-api:
        condition: service_healthy
      xero-api:
        condition: service_healthy
    environment:
      - AIRTABLE_API_URL=http://airtable-api:8032
      - ASANA_API_URL=http://asana-api:8031
      - CALENDLY_API_URL=http://calendly-api:8054
      - CONTENTFUL_API_URL=http://contentful-api:8066
      - DOCUSIGN_API_URL=http://docusign-api:8053
      - GMAIL_API_URL=http://gmail-api:8017
      - GOOGLE_ANALYTICS_API_URL=http://google-analytics-api:8068
      - HUBSPOT_API_URL=http://hubspot-api:8024
      - INSTAGRAM_API_URL=http://instagram-api:8003
      - KLAVIYO_API_URL=http://klaviyo-api:8089
      - LINEAR_API_URL=http://linear-api:8004
      - MAILCHIMP_API_URL=http://mailchimp-api:8081
      - MIXPANEL_API_URL=http://mixpanel-api:8056
      - NOTION_API_URL=http://notion-api:8010
      - PLAID_API_URL=http://plaid-api:8022
      - QUICKBOOKS_API_URL=http://quickbooks-api:8007
      - SALESFORCE_API_URL=http://salesforce-api:8044
      - SLACK_API_URL=http://slack-api:8013
      - STRIPE_API_URL=http://stripe-api:8021
      - TWILIO_API_URL=http://twilio-api:8026
      - WEBFLOW_API_URL=http://webflow-api:8100
      - WOOCOMMERCE_API_URL=http://woocommerce-api:8085
      - WORDPRESS_API_URL=http://wordpress-api:8065
      - XERO_API_URL=http://xero-api:8088
      - LITELLM_BASE_URL=http://litellm-proxy:4000
      - OPENAI_API_BASE=http://litellm-proxy:4000/v1
      - OPENAI_API_KEY=placeholder
      - TEST_DIR=${TEST_DIR:-/tests}
    volumes:
      - ${HOST_VERIFIER_LOGS_PATH:-./logs/verifier}:${ENV_VERIFIER_LOGS_PATH:-/logs/verifier}
  airtable-api:
    build:
      context: ./airtable-api
    image: harbor-airtable-api:local
    expose:
      - "8032"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8032/health',timeout=3).status<400 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256Mi
  asana-api:
    build:
      context: ./asana-api
    image: harbor-asana-api:local
