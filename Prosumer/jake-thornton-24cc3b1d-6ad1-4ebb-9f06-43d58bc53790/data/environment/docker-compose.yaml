services:
  main:
    build:
      context: .
    image: harbor-main:local
    command: ["sleep", "infinity"]
    depends_on:
      airtable-api:
        condition: service_healthy
      calendly-api:
        condition: service_healthy
      contentful-api:
        condition: service_healthy
      docusign-api:
        condition: service_healthy
      eventbrite-api:
        condition: service_healthy
      gmail-api:
        condition: service_healthy
      google-calendar-api:
        condition: service_healthy
      hubspot-api:
        condition: service_healthy
      instagram-api:
        condition: service_healthy
      mailchimp-api:
        condition: service_healthy
      monday-api:
        condition: service_healthy
      pagerduty-api:
        condition: service_healthy
      paypal-api:
        condition: service_healthy
      plaid-api:
        condition: service_healthy
      quickbooks-api:
        condition: service_healthy
      sendgrid-api:
        condition: service_healthy
      square-api:
        condition: service_healthy
      stripe-api:
        condition: service_healthy
      trello-api:
        condition: service_healthy
      twilio-api:
        condition: service_healthy
      typeform-api:
        condition: service_healthy
      wordpress-api:
        condition: service_healthy
      xero-api:
        condition: service_healthy
    environment:
      - AIRTABLE_API_URL=http://airtable-api:8032
      - CALENDLY_API_URL=http://calendly-api:8054
      - CONTENTFUL_API_URL=http://contentful-api:8066
      - DOCUSIGN_API_URL=http://docusign-api:8053
      - EVENTBRITE_API_URL=http://eventbrite-api:8020
      - GMAIL_API_URL=http://gmail-api:8017
      - GOOGLE_CALENDAR_API_URL=http://google-calendar-api:8016
      - HUBSPOT_API_URL=http://hubspot-api:8024
      - INSTAGRAM_API_URL=http://instagram-api:8003
      - MAILCHIMP_API_URL=http://mailchimp-api:8081
      - MONDAY_API_URL=http://monday-api:8080
      - PAGERDUTY_API_URL=http://pagerduty-api:8040
      - PAYPAL_API_URL=http://paypal-api:8042
      - PLAID_API_URL=http://plaid-api:8022
      - QUICKBOOKS_API_URL=http://quickbooks-api:8007
      - SENDGRID_API_URL=http://sendgrid-api:8027
      - SQUARE_API_URL=http://square-api:8041
      - STRIPE_API_URL=http://stripe-api:8021
      - TRELLO_API_URL=http://trello-api:8030
      - TWILIO_API_URL=http://twilio-api:8026
      - TYPEFORM_API_URL=http://typeform-api:8055
      - WORDPRESS_API_URL=http://wordpress-api:8065
      - XERO_API_URL=http://xero-api:8088
      - LITELLM_BASE_URL=http://litellm-proxy:4000
      - OPENAI_API_BASE=http://litellm-proxy:4000/v1
      - OPENAI_API_KEY=placeholder
      - TEST_DIR=${TEST_DIR:-/tests}
    volumes:
      - ${HOST_VERIFIER_LOGS_PATH:-./logs/verifier}:${ENV_VERIFIER_LOGS_PATH:-/logs/verifier}
  airtable-api:
    build:
      context: ./airtable-api
    image: harbor-airtable-api:local
    expose:
      - "8032"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8032/health',timeout=3).status<400 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256Mi
  calendly-api:
    build:
      context: ./calendly-api
    image: harbor-calendly-api:local
