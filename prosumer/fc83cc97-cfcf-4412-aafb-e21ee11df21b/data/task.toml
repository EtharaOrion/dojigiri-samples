schema_version = "1.1"

[task]
name = "fc83cc97-cfcf-4412-aafb-e21ee11df21b"
description = "I need you to get my upcoming New Year soul food home class fully buttoned up before I lose the thread, because my head is half in birth work and half in a stockpot and I cannot afford to guess on any of it. Start with the enrollment, because that is the number everything else hangs off of, and I have a nagging worry that the seat count I remember is not the seat count that is actually true right now. I want you to go to the live booking record for that class and pull the confirmed roster, name by name, and tell me exactly how many paying students are locked for that afternoon, because I have a planning note floating around that says one thing and a booking screen that may say another, and I keep almost buying supplies for the wrong-sized table. Once you have the honest headcount, make sure every count I am carrying agrees with it so I am not chasing ghosts, and if the count I was working from is stale I want to know which of my systems is lying to me so I can stop trusting it. With the real number in hand, do the money the way I actually run this thing at my home seat price, against roughly two hundred dollars of groceries per class, and I want the gross, the supply cost, the contribution left over, and the honest break even seat count so I know how thin this one runs. Then scale my base soul food recipes, which are written for six servings, up to whatever the true confirmed headcount turns out to be, and give me the multiplier and the adjusted quantities for the heavy hitters so I hand my shopping list to you clean rather than coming up short on collard greens again. On the supply run, build me the grocery order against that scaled quantity list and stage it ready to review, and pull the go or no go read on the weather for East Lake that afternoon so I know whether a rainy afternoon is going to wreck parking and turnout for a full table coming through my door. I also want the waiver situation confirmed for every student, so check that the consent paperwork is out to each person on the honest roster and flag anyone who has not signed, because I am not running a knife in a stranger's hand without that on file. On the family side, look hard at whether Gloria's coverage and my on call rotation still line up the way I think they do, because coverage days have a way of quietly swapping on me and I only find out when nobody shows. Surface any collision between that class block, my clinic recurring block, and Gloria's standby so I can fix it before it bites. Now the part that keeps me up, my birth clients, because they sit above everything else on this list. I need every active client on the tracker and their due dates re read fresh, not from memory, because I am fairly sure at least one moved after an ultrasound and I do not trust the version in my head anymore. Give me each client and the current due date you actually find, and if any of them is inside two weeks of that class I want that screaming at the top so I know whether I am about to teach a three hour class while someone could go into labor. On the money picture for the business, give me a clean read on where Jake's Table cash actually sits right now, the available balance I can spend against, so I know if this supply run and the rest of the month are comfortable or tight. Pull the class income reconciliation from my books for the recent quarters so I can see class revenue landing the way I expect and catch anything that looks off, and if a preliminary figure and a corrected figure disagree I want the trustworthy one, not the first one you hit. I want all of this to land somewhere I can actually use it, starting with a class operations brief for that afternoon that carries the confirmed roster, the reconciled headcount, the money math with break even, the scaled ingredient plan, the weather read, the waiver status, and the family and on call collision check, written plain enough that Marcus could read it and know exactly what our afternoon looks like. Alongside that I want a short reconciliation writeup that lays the enrollment against the supply plan and the cash on hand side by side, so the number of seats, the groceries I am buying for, and the dollars behind it all agree with each other instead of drifting apart in three different apps. Stage and draft everything, but hold the green light for me before anything actually leaves the building, no email out, no order placed, no booking moved until I say go. And if any single charge on this supply run trips my usual approval line, or anything recurring would run over a hundred a month, stop and put it in front of me before you commit it, because I would rather approve it than find it. Work the whole chain in order and bring me the honest picture with both writeups ready and anything that needs my sign off called out clearly so I can nod and move.  --- Workspace inputs (already staged on disk at `/root/workspace/`): - 01.tsv - 02.docx - 03.pdf - 04.pdf - 05.xml - 06.xml - 07.png - 08.jpg - 09.pdf - 10.xml - 11.mp3 - 12.docx - 13.docx - 14.jpg - 15.pdf - 16.pdf - 17.xml - 18.mp4 - 19.docx - 20.mp3 - 22.jpg - 23.xml - 24.pdf - 25.jpg - 26.pdf - 27.pdf - 28.pdf - 29.tsv - 30.xml - 31.xml - 32.docx - 33.jpg - 34.jpg - 35.docx - 36.tsv - 37.tsv - 38.tsv - 39.xml - 40.jpg - 41.xml - 42.pdf - 43.xml - 44.tsv - 45.tsv - 46.tsv - 47.tsv - 48.tsv - 49.html - 50.html - 51.html - 52.pptx - 53.pptx - 54.pptx - v1.mp4 Any FILE you produce must be saved under `/root/workspace/` — files written anywhere else (including `/tmp/` and elsewhere under `/root/`) will NOT be collected. This is a file-collection rule only; it does not change where the task's deliverables belong. If the task calls for work in an external system or service (for example creating or updating pages, records, or cards through the available APIs), do that work there as asked — a local file copy does not replace it."
authors = []
keywords = ["Productivity Flow", "hard"]

