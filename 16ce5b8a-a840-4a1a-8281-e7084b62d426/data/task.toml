[task]
name = "16ce5b8a-a840-4a1a-8281-e7084b62d426"
description = "I need the Hartwell Foundation application packet finalized and delivered through the funder submission portal by the end of the month. Their program officer invited the full proposal after our letter of intent cleared, and they have scheduled the site visit for roughly two weeks before the Livernois grand opening even happens, so the timing is tight and everything has to be defensible before I hand it over. This is a ninety-thousand-dollar ask spread across the next two to three years, and it sits inside an operating budget of about eight hundred fifty thousand, so the numbers cannot be sloppy anywhere.  Start with the narrative. It has to come in under their word limit and speak directly to creative youth development, and it needs to show how this funding strengthens our multi-year trajectory rather than creating a dependency we cannot sustain once the grant period ends. The story we tell has to match what we have already committed to Greenfield, Beacon, the Arts and Culture fund, and the City, because those relationships are live and a contradiction would cost us more than this one grant is worth. Whatever figures we put in front of Hartwell need to reconcile against what we can actually deliver on, and they cannot quietly restate anything a current funder already believes to be true.  The budget is the part that worries me most. I want the ask broken out so that every dollar is labeled honestly, what is restricted, what is general operating, what is genuinely project support, and I want the indirect treatment to be consistent with the precedents we have already set elsewhere rather than whatever makes this single application look cleanest. Somewhere in our records the served-youth figures have moved across reporting periods, and I would rather find that now and settle on one number I can stand behind than get caught in front of the program officer citing something our own board report contradicts. Surface those discrepancies for me. Do not paper over them. If the counts do not line up across what we filed for the quarter, what lives in our project tracker, and what went to Greenfield in the year-end report, I need to know before a single figure lands in the narrative.  Patricia has to sign the board resolution authorizing the submission, and before you finalize anything for her signature you need to respect how she wants board materials routed to her. She has a delivery preference and she notices when it is ignored. The October board meeting endorsed moving forward with Hartwell, but before you lean on anything from that discussion in the application, verify whether any of it was marked executive session, because some of what was said in that room was never meant to travel outside it.  For the site visit itself I need a briefing package that Marcus and I can both work from, because when the program officer walks the Cass Avenue office and starts asking hard questions, the two of us have to defend every figure in the room without you sitting beside us. Pull the impact numbers from the June showcase into something clean. Build a youth outcomes brief that will hold up under cross-examination while staying strictly aggregate and de-identified, no individual names, no attendance sheets, no art submissions, no family stories, because that line is not one I am willing to cross for any funder. Sketch a facility tour plan that acknowledges Livernois will not physically be open yet, so we walk them through Cass and speak honestly about where we are on the construction timeline instead of pretending. Draft talking points for Marcus so the two of us are not contradicting each other on program scope or headcount when someone presses. And give me a portfolio brief that frames the full funder picture with a sustainability answer I can actually defend, because that is the question that always comes and I do not want to improvise it.  Then I need a reconciliation brief written for Patricia and the finance committee review. Show me how this ninety-thousand ask sits inside the eight-fifty operating budget once you account for every funding stream we are carrying, the confirmed grants, the ones still pending renewal, and the ones we are only cultivating. Every stream needs a label and every overlap needs to be flagged, because the fastest way to lose a funder is to let the same restricted dollar get counted twice across two applications. If a program is already covered by a restricted grant, it cannot show up again as unmet need in this one.  The whole thing has to cross-check end to end. The narrative, the budget, the resolution, the outcome metrics, and the site-visit materials all have to tell one story, and if you find a place where two of them disagree, stop and flag it rather than quietly picking one. I would rather reconcile a hard discrepancy with Marcus and the board now than discover it in early November with a program officer standing in our office. One more constraint on the calendar side, the site visit falls close to the Livernois work, the grand opening lands in late November with a ribbon-cutting the Greenfield officer plans to attend, and the two weeks right before that are already crowded with contractor walk-throughs and setup. Cross-check the calendar against our high-stakes commitments before you propose any window for the visit, because a scheduling collision there is not something I can absorb.  --- Workspace inputs (already staged on disk at `/root/workspace/`): - a1.mp3 - a2.mp3 - file_1.pdf - file_10.docx - file_11.xlsx - file_12.pdf - file_13.xlsx - file_14.docx - file_15.docx - file_16.pdf - file_17.tsv - file_18.pdf - file_19.pdf - file_2.docx - file_20.tsv - file_21.xlsx - file_22.tsv - file_23.docx - file_24.xlsx - file_26.tsv - file_27.docx - file_28.docx - file_29.pdf - file_3.pdf - file_30.tsv - file_31.tsv - file_33.docx - file_34.tsv - file_35.docx - file_36.xlsx - file_37.docx - file_38.xlsx - file_39.tsv - file_4.xlsx - file_40.html - file_41.html - file_42.html - file_43.html - file_44.pptx - file_45.pptx - file_46.pptx - file_47.pptx - file_48.xml - file_49.xml - file_5.pdf - file_50.xml - file_51.xml - file_6.xlsx - file_7.tsv - file_8.pdf - file_9.docx - img-1.jpg - img-2.jpg - img-3.jpg - img-4.jpg - v1.mp4 - v2.mp4 Any FILE you produce must be saved under `/root/workspace/` — files written anywhere else (including `/tmp/` and elsewhere under `/root/`) will NOT be collected. This is a file-collection rule only; it does not change where the task's deliverables belong. If the task calls for work in an external system or service (for example creating or updating pages, records, or cards through the available APIs), do that work there as asked — a local file copy does not replace it."
