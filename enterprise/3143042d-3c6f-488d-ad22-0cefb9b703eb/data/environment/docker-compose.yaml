services:
  main:
    build:
      context: .
    image: harbor-main:local
    command: ["sleep", "infinity"]
    depends_on:
      airtable-api:
        condition: service_healthy
      asana-api:
        condition: service_healthy
      bamboohr-api:
        condition: service_healthy
      calendly-api:
        condition: service_healthy
      confluence-api:
        condition: service_healthy
      docusign-api:
        condition: service_healthy
      eventbrite-api:
        condition: service_healthy
      gmail-api:
        condition: service_healthy
      google-calendar-api:
        condition: service_healthy
      google-classroom-api:
        condition: service_healthy
      greenhouse-api:
        condition: service_healthy
      gusto-api:
        condition: service_healthy
      hubspot-api:
        condition: service_healthy
      linkedin-api:
        condition: service_healthy
      microsoft-teams-api:
        condition: service_healthy
      notion-api:
        condition: service_healthy
      okta-api:
        condition: service_healthy
      outlook-api:
        condition: service_healthy
      plaid-api:
        condition: service_healthy
      quickbooks-api:
        condition: service_healthy
      salesforce-api:
        condition: service_healthy
      servicenow-api:
        condition: service_healthy
      slack-api:
        condition: service_healthy
      stripe-api:
        condition: service_healthy
      twilio-api:
        condition: service_healthy
      typeform-api:
        condition: service_healthy
      whatsapp-api:
        condition: service_healthy
      zoom-api:
        condition: service_healthy
    environment:
      - AIRTABLE_API_URL=http://airtable-api:8032
      - ASANA_API_URL=http://asana-api:8031
      - BAMBOOHR_API_URL=http://bamboohr-api:8072
      - CALENDLY_API_URL=http://calendly-api:8054
      - CONFLUENCE_API_URL=http://confluence-api:8045
      - DOCUSIGN_API_URL=http://docusign-api:8053
      - EVENTBRITE_API_URL=http://eventbrite-api:8020
      - GMAIL_API_URL=http://gmail-api:8017
      - GOOGLE_CALENDAR_API_URL=http://google-calendar-api:8016
      - GOOGLE_CLASSROOM_API_URL=http://google-classroom-api:8002
      - GREENHOUSE_API_URL=http://greenhouse-api:8073
      - GUSTO_API_URL=http://gusto-api:8074
      - HUBSPOT_API_URL=http://hubspot-api:8024
      - LINKEDIN_API_URL=http://linkedin-api:8062
      - MICROSOFT_TEAMS_API_URL=http://microsoft-teams-api:8086
      - NOTION_API_URL=http://notion-api:8010
      - OKTA_API_URL=http://okta-api:8049
      - OUTLOOK_API_URL=http://outlook-api:8087
      - PLAID_API_URL=http://plaid-api:8022
      - QUICKBOOKS_API_URL=http://quickbooks-api:8007
      - SALESFORCE_API_URL=http://salesforce-api:8044
      - SERVICENOW_API_URL=http://servicenow-api:8071
      - SLACK_API_URL=http://slack-api:8013
      - STRIPE_API_URL=http://stripe-api:8021
      - TWILIO_API_URL=http://twilio-api:8026
      - TYPEFORM_API_URL=http://typeform-api:8055
      - WHATSAPP_API_URL=http://whatsapp-api:8015
      - ZOOM_API_URL=http://zoom-api:8028
      - LITELLM_BASE_URL=http://litellm-proxy:4000
      - OPENAI_API_BASE=http://litellm-proxy:4000/v1
      - OPENAI_API_KEY=placeholder
      - TEST_DIR=${TEST_DIR:-/tests}
    volumes:
      - ${HOST_VERIFIER_LOGS_PATH:-./logs/verifier}:${ENV_VERIFIER_LOGS_PATH:-/logs/verifier}
  airtable-api:
    build:
      context: ./airtable-api
    image: harbor-airtable-api:local
    expose:
      - "8032"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8032/health',timeout=3).status<400 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256Mi
  asana-api:
    build:
      context: ./asana-api
    image: harbor-asana-api:local
    expose:
      - "8031"
